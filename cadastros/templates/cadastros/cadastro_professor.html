{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Professor</title>
    

    <link rel="stylesheet" href="{% static 'css/cadastros/cadastro_professor.css' %}">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="container">

    <div class="card">

        <div class="logo">
            <i class="fas fa-dumbbell"></i>
        </div>

        <h1>Criar Conta</h1>

        <p class="subtitulo">
            Cadastre-se gratuitamente para começar a gerenciar seus alunos.
        </p>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                <i class="fas fa-user-plus"></i>
                Criar Conta
            </button>

        </form>

        <div class="rodape">

            <span>Já possui uma conta?</span>

            <a href="{% url 'login' %}">
                Entrar
            </a>

        </div>

    </div>

</div>

</body>
</html>
